<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeOS Ultra - מערכת ניהול חיים</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: rgba(255, 255, 255, 0.85);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --border: 1px solid rgba(255, 255, 255, 0.18);
        }

        [data-theme="dark"] {
            --primary: #818cf8;
            --secondary: #c084fc;
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --card-bg: rgba(30, 41, 59, 0.7);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --border: 1px solid rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* Glassmorphism Header */
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 25px;
            border-radius: 24px;
            color: white;
            box-shadow: 0 10px 40px -10px var(--primary);
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .level-badge {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .progress-container {
            background: rgba(0,0,0,0.2);
            height: 10px;
            border-radius: 10px;
            margin-top: 10px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: #4ade80;
            border-radius: 10px;
            width: 0%;
            transition: width 1s ease;
            box-shadow: 0 0 10px #4ade80;
        }

        .xp-text { font-size: 0.8rem; margin-top: 5px; opacity: 0.9; text-align: left; }

        /* Controls */
        .controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: var(--shadow);
            color: var(--text-color);
            backdrop-filter: blur(4px);
        }

        /* Habits List */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .habit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            transition: transform 0.2s, background 0.2s;
            cursor: pointer;
        }

        .habit-item:active { transform: scale(0.98); }
        .habit-item.completed { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); }
        
        .habit-left { display: flex; align-items: center; gap: 15px; }
        .icon-box {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            color: #4f46e5;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }

        [data-theme="dark"] .icon-box { background: linear-gradient(135deg, #312e81, #4338ca); color: #e0e7ff; }

        /* Add Button */
        .fab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 60px; height: 60px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            border: none;
            z-index: 100;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center; justify-content: center;
            z-index: 200;
        }
        .modal-content {
            background: var(--bg-color);
            padding: 30px;
            border-radius: 20px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }
        .modal input {
            width: 100%; padding: 10px; margin: 10px 0;
            border-radius: 8px; border: 1px solid #ccc;
            font-size: 16px;
        }
        .btn-primary {
            background: var(--primary); color: white; border: none;
            padding: 10px 20px; border-radius: 10px; width: 100%; font-size: 16px; cursor: pointer;
        }
        
        .delete-btn { color: #ef4444; margin-right: 10px; cursor: pointer; font-size: 0.9rem; }

    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>

    <header>
        <div class="header-top">
            <div>
                <h1 style="margin:0; font-size:1.5rem;">היי, אלוף!</h1>
                <div style="font-size:0.9rem; opacity:0.8">רמת המשמעת שלך</div>
            </div>
            <div class="level-badge">LVL <span id="levelDisplay">1</span></div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="xpBar"></div>
        </div>
        <div class="xp-text"><span id="xpDisplay">0</span> / <span id="xpNext">100</span> XP</div>
    </header>

    <div class="card">
        <h3 style="margin-top:0">📈 המומנטום שלך</h3>
        <canvas id="chartCanvas" height="150"></canvas>
    </div>

    <div class="card" id="habitsList">
        </div>
</div>

<button class="fab" onclick="openModal()">+</button>

<div class="modal" id="addModal">
    <div class="modal-content">
        <h2 style="color:var(--text-color)">הוסף הרגל חדש</h2>
        <input type="text" id="newHabitName" placeholder="שם ההרגל (למשל: לקרוא ספר)">
        <select id="newHabitIcon" style="width:100%; padding:10px; border-radius:8px; margin-bottom:15px;">
            <option value="fas fa-running">🏃 כושר</option>
            <option value="fas fa-book">📚 לימודים</option>
            <option value="fas fa-glass-water">💧 בריאות</option>
            <option value="fas fa-moon">😴 שינה</option>
            <option value="fas fa-brain">🧠 מנטלי</option>
            <option value="fas fa-briefcase">💼 עבודה</option>
        </select>
        <button class="btn-primary" onclick="addHabit()">הוסף לרשימה</button>
        <button onclick="closeModal()" style="margin-top:10px; background:none; border:none; color:var(--text-color); cursor:pointer">ביטול</button>
    </div>
</div>

<script>
    // --- State Management ---
    let state = {
        level: 1,
        xp: 0,
        theme: 'light',
        habits: [
            { id: 1, name: "אימון בוקר", icon: "fas fa-running", completed: false },
            { id: 2, name: "שתיתי 3 ליטר מים", icon: "fas fa-glass-water", completed: false },
            { id: 3, name: "מדיטציה 10 דקות", icon: "fas fa-brain", completed: false }
        ],
        history: [] // שמירת היסטוריית ציונים
    };

    // --- Init ---
    function init() {
        const saved = localStorage.getItem('lifeOS_ultra');
        if (saved) {
            state = JSON.parse(saved);
            // איפוס יומי אם התאריך השתנה (לוגיקה בסיסית)
            const lastDate = localStorage.getItem('last_date');
            const today = new Date().toDateString();
            if (lastDate !== today) {
                state.habits.forEach(h => h.completed = false);
                // שמירת היסטוריה
                if(state.history.length > 6) state.history.shift();
                // ציון דמי לגרף
                state.history.push(Math.floor(Math.random() * 100)); 
                localStorage.setItem('last_date', today);
            }
        }
        
        applyTheme();
        render();
        updateChart();
    }

    // --- Rendering ---
    function render() {
        // Update XP & Level
        const xpNext = state.level * 100;
        document.getElementById('levelDisplay').innerText = state.level;
        document.getElementById('xpDisplay').innerText = state.xp;
        document.getElementById('xpNext').innerText = xpNext;
        document.getElementById('xpBar').style.width = (state.xp / xpNext * 100) + "%";

        // Render Habits
        const list = document.getElementById('habitsList');
        list.innerHTML = `<h3 style="margin-top:0">🎯 המשימות להיום</h3>`;
        
        state.habits.forEach((habit, index) => {
            const div = document.createElement('div');
            div.className = `habit-item ${habit.completed ? 'completed' : ''}`;
            div.onclick = () => toggleHabit(index);
            div.innerHTML = `
                <div class="habit-left">
                    <div class="icon-box"><i class="${habit.icon}"></i></div>
                    <span style="${habit.completed ? 'text-decoration:line-through; opacity:0.6' : ''}">${habit.name}</span>
                </div>
                <div>
                    ${habit.completed ? '<i class="fas fa-check-circle" style="color:#10b981; font-size:1.5rem;"></i>' : '<i class="far fa-circle" style="color:#cbd5e1; font-size:1.5rem;"></i>'}
                </div>
                <i class="fas fa-trash delete-btn" onclick="deleteHabit(event, ${index})" style="margin-right:15px; opacity:0.3;"></i>
            `;
            list.appendChild(div);
        });

        saveState();
    }

    // --- Actions ---
    function toggleHabit(index) {
        const habit = state.habits[index];
        habit.completed = !habit.completed;
        
        if (habit.completed) {
            state.xp += 20;
            checkLevelUp();
            // אפקט רטט בטלפון
            if(navigator.vibrate) navigator.vibrate(50);
            
            // בדיקה אם הכל הושלם - זיקוקים
            const allDone = state.habits.every(h => h.completed);
            if (allDone) triggerConfetti();
        } else {
            state.xp -= 20;
            if (state.xp < 0) state.xp = 0;
        }
        render();
    }

    function checkLevelUp() {
        const xpNext = state.level * 100;
        if (state.xp >= xpNext) {
            state.level++;
            state.xp = state.xp - xpNext;
            triggerConfetti();
            alert("🎉 עלית לרמה " + state.level + "! אתה תותח!");
        }
    }

    function addHabit() {
        const name = document.getElementById('newHabitName').value;
        const icon = document.getElementById('newHabitIcon').value;
        if (!name) return;

        state.habits.push({
            id: Date.now(),
            name: name,
            icon: icon,
            completed: false
        });
        closeModal();
        render();
    }

    function deleteHabit(e, index) {
        e.stopPropagation();
        if(confirm("למחוק את ההרגל הזה?")) {
            state.habits.splice(index, 1);
            render();
        }
    }

    // --- Theme & Extras ---
    function toggleTheme() {
        state.theme = state.theme === 'light' ? 'dark' : 'light';
        applyTheme();
        saveState();
    }

    function applyTheme() {
        document.documentElement.setAttribute('data-theme', state.theme);
        updateChart();
    }

    function triggerConfetti() {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
        });
    }

    // --- Modal Logic ---
    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function saveState() {
        localStorage.setItem('lifeOS_ultra', JSON.stringify(state));
    }

    // --- Chart ---
    let myChart;
    function updateChart() {
        const ctx = document.getElementById('chartCanvas').getContext('2d');
        const color = state.theme === 'dark' ? '#818cf8' : '#4f46e5';
        
        if (myChart) myChart.destroy();

        // נתוני דמי אם אין היסטוריה
        const dataPoints = state.history.length ? state.history : [20, 45, 60, 80, 50, 90, 100];

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'],
                datasets: [{
                    label: 'ביצועים',
                    data: dataPoints,
                    borderColor: color,
                    backgroundColor: state.theme === 'dark' ? 'rgba(129, 140, 248, 0.2)' : 'rgba(79, 70, 229, 0.1)',
                    tension: 0.4,
                    fill: true,
                    pointRadius: 4
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    y: { display: false },
                    x: { grid: { display: false }, ticks: { color: state.theme === 'dark' ? '#94a3b8' : '#64748b' } }
                }
            }
        });
    }

    init();
</script>
</body>
</html>
